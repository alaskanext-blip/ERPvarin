<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Contable SII | Simple</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js y SheetJS (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; }
        /* Scrollbar personalizado para las tablas */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICONOS SVG ---
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const IconInvoice = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
        const IconReceipt = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></svg>;
        const IconCreditNote = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>;
        const IconBuilding = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>;
        const IconTrendingUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
        const IconBriefcase = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
        const IconShoppingCart = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const IconChevronDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>;
        const IconShip = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M12 10v4"/><path d="M12 2v3"/></svg>;

        // --- UTILIDADES ---
        const formatCurrency = (val) => new Intl.NumberFormat('es-CL', {style:'currency', currency:'CLP', maximumFractionDigits:0}).format(val || 0);
        const formatNumber = (val) => new Intl.NumberFormat('es-CL').format(val || 0);
        const getInt = (val) => parseInt(String(val).replace(/\D/g, ''), 10) || 0;

        const monthMap = { "Enero": 1, "Febrero": 2, "Marzo": 3, "Abril": 4, "Mayo": 5, "Junio": 6, "Julio": 7, "Agosto": 8, "Septiembre": 9, "Octubre": 10, "Noviembre": 11, "Diciembre": 12 };
        const getMonthValue = (mStr) => {
            if (!mStr || mStr === 'Todos') return 0;
            const parts = mStr.split(' ');
            if (parts.length < 2) return 999999;
            return parseInt(parts[1]) * 100 + (monthMap[parts[0]] || 0);
        };

        // --- COMPONENTE DE GRÁFICO DE LÍNEAS MÚLTIPLES ---
        const MultiLineChart = ({ title, labels, datasets, isExporting }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !datasets || datasets.length === 0) return;
                if (chartInstance.current) chartInstance.current.destroy();

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: datasets.map(ds => ({
                            label: ds.label,
                            data: ds.data,
                            borderColor: ds.borderColor,
                            backgroundColor: ds.bgColor || 'transparent',
                            fill: ds.fill || false,
                            tension: 0.3,
                            borderWidth: 2,
                            pointRadius: isExporting ? 2 : 4,
                            pointBackgroundColor: ds.borderColor
                        }))
                    },
                    options: {
                        responsive: true, 
                        maintainAspectRatio: false,
                        animation: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: { 
                            legend: { 
                                display: true,
                                position: 'top',
                                labels: { boxWidth: 12, font: { size: isExporting ? 9 : 12 } }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) label += ': ';
                                        if (context.parsed.y !== null) {
                                            const valStr = Math.abs(context.parsed.y) >= 1000000 
                                                ? (Math.abs(context.parsed.y)/1000000).toFixed(1) + 'M' 
                                                : new Intl.NumberFormat('es-CL').format(Math.abs(context.parsed.y));
                                            label += (context.parsed.y < 0 ? '-' : '') + '$' + valStr;
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { font: { size: isExporting ? 9 : 11 } }
                            },
                            y: {
                                grid: { borderDash: [2, 4], color: '#e2e8f0' },
                                ticks: { 
                                    font: { size: isExporting ? 9 : 11 },
                                    callback: (v) => {
                                        const valStr = Math.abs(v) >= 1000000 
                                            ? (Math.abs(v)/1000000).toFixed(1) + 'M' 
                                            : new Intl.NumberFormat('es-CL').format(Math.abs(v));
                                        return (v < 0 ? '-' : '') + '$' + valStr;
                                    }
                                }
                            }
                        }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [labels, datasets, isExporting]);

            return (
                <div className={`bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col ${isExporting ? 'h-48 p-3 !shadow-none' : 'h-80 p-5'}`}>
                    <h3 className={`font-bold text-slate-700 mb-2 ${isExporting ? 'text-xs' : 'text-sm'}`}>{title}</h3>
                    <div className="flex-1 relative w-full h-full">
                        <canvas ref={chartRef}></canvas>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE DE GRÁFICO CIRCULAR (DOUGHNUT) ---
        const DoughnutChart = ({ title, labels, data, isExporting }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !data || data.length === 0) return;
                if (chartInstance.current) chartInstance.current.destroy();

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: [
                                '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#cbd5e1'
                            ],
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: { boxWidth: 12, font: { size: isExporting ? 9 : 11 } }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.label || '';
                                        if (label) { label += ': '; }
                                        const value = context.parsed;
                                        const total = context.dataset.data.reduce((acc, curr) => acc + curr, 0);
                                        const percentage = ((value / total) * 100).toFixed(1) + '%';
                                        label += '$' + new Intl.NumberFormat('es-CL').format(value) + ' (' + percentage + ')';
                                        return label;
                                    }
                                }
                            }
                        }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [labels, data, isExporting]);

            return (
                <div className={`bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col ${isExporting ? 'h-40 p-3 !shadow-none' : 'h-64 p-5'}`}>
                    <h3 className={`font-bold text-slate-700 mb-2 ${isExporting ? 'text-xs' : 'text-sm'}`}>{title}</h3>
                    <div className="flex-1 relative w-full h-full flex justify-center">
                        <canvas ref={chartRef}></canvas>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE COLAPSABLE PARA TABLAS ---
        const CollapsibleTable = ({ title, count, children, isExporting }) => {
            const [isOpen, setIsOpen] = useState(false);
            const displayOpen = isExporting || isOpen;

            return (
                <div className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col transition-all duration-300 ${displayOpen ? (isExporting ? 'h-auto max-h-none' : 'h-auto max-h-[500px]') : 'h-auto'}`}>
                    <button 
                        onClick={() => setIsOpen(!isOpen)} 
                        className="bg-slate-50 hover:bg-slate-100 border-b border-transparent data-[open=true]:border-slate-200 p-4 flex justify-between items-center w-full transition-colors"
                        data-open={displayOpen}
                    >
                        <h3 className="font-bold text-slate-800 flex items-center gap-2">
                            {title}
                            <span className="text-xs bg-slate-200 text-slate-600 py-1 px-2 rounded-md">{count} Docs.</span>
                        </h3>
                        <div className={`transition-transform duration-200 text-slate-500 ${isOpen ? 'rotate-180' : ''}`}>
                            <IconChevronDown />
                        </div>
                    </button>
                    {displayOpen && (
                        <div className={`overflow-auto custom-scrollbar flex-1 p-0 ${isExporting ? '!overflow-visible !max-h-none h-auto' : ''}`}>
                            {children}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [dataVentasResumen, setDataVentasResumen] = useState([]);
            const [dataVentasDetalle, setDataVentasDetalle] = useState([]);
            const [dataComprasDetalle, setDataComprasDetalle] = useState([]);
            const [dataHonorarios, setDataHonorarios] = useState([]);
            const [loading, setLoading] = useState(false);
            const [selectedMonth, setSelectedMonth] = useState('Todos');
            const [isExporting, setIsExporting] = useState(false);
            const [selectedProveedor, setSelectedProveedor] = useState('Todos');

            // Resetear filtro al cambiar de mes
            useEffect(() => {
                setSelectedProveedor('Todos');
            }, [selectedMonth]);

            const parseCSV = async (file) => {
                const text = await file.text();
                const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                if (lines.length < 2) return null;
                const headers = lines[0].split(';');
                
                const data = lines.slice(1).map(line => {
                    const values = line.split(';');
                    let obj = {};
                    headers.forEach((h, i) => { obj[h.trim()] = values[i] ? values[i].trim() : ''; });
                    return obj;
                });
                return { headers, data };
            };

            const handleFileUpload = async (event) => {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                setLoading(true);

                let newResumenVentas = [];
                let newDetalleVentas = [];
                let newDetalleCompras = [];
                let newHonorarios = [];

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileNameLow = file.name.toLowerCase();

                    // --- 1. LECTURA EXCEL DE HONORARIOS ---
                    if (fileNameLow.includes('informe bh') || file.name.endsWith('.xlsx')) {
                        const buffer = await file.arrayBuffer();
                        const workbook = window.XLSX.read(buffer, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[sheetName];
                        const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1 });

                        let headerIdx = -1;
                        for (let r = 0; r < Math.min(20, rows.length); r++) {
                            if (!rows[r]) continue;
                            const rStr = rows[r].join(" ").toLowerCase();
                            if (rStr.includes("brutos") && rStr.includes("fecha")) {
                                headerIdx = r;
                                break;
                            }
                        }

                        if (headerIdx !== -1) {
                            const headers = rows[headerIdx].map(h => String(h).trim());
                            const iFecha = headers.findIndex(h => h.toLowerCase() === 'fecha');
                            const iRut = headers.findIndex(h => h.toLowerCase() === 'rut');
                            const iNombre = headers.findIndex(h => h.toLowerCase().includes('nombre') || h.toLowerCase().includes('razón'));
                            const iBrutos = headers.findIndex(h => h.toLowerCase() === 'brutos');
                            const iRetenido = headers.findIndex(h => h.toLowerCase() === 'retenido');
                            const iPagado = headers.findIndex(h => h.toLowerCase() === 'pagado');

                            for (let r = headerIdx + 1; r < rows.length; r++) {
                                const row = rows[r];
                                if (!row || !row[iFecha]) continue;

                                const fechaVal = row[iFecha];
                                let mesStr = "Desconocido";
                                
                                let dateObj;
                                if (typeof fechaVal === 'number') {
                                    dateObj = new Date(Math.round((fechaVal - 25569) * 86400 * 1000));
                                } else {
                                    dateObj = new Date(fechaVal);
                                }
                                
                                if (dateObj && !isNaN(dateObj.getTime())) {
                                    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                                    mesStr = `${monthNames[dateObj.getUTCMonth()]} ${dateObj.getUTCFullYear()}`;
                                } else if (typeof fechaVal === 'string') {
                                    const matchDate = fechaVal.match(/(\d{4})-(\d{2})-\d{2}/);
                                    if (matchDate) {
                                        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                                        mesStr = `${monthNames[parseInt(matchDate[2]) - 1]} ${matchDate[1]}`;
                                    }
                                }

                                newHonorarios.push({
                                    Mes: mesStr,
                                    Rut: row[iRut],
                                    RazonSocial: row[iNombre],
                                    Fecha: typeof fechaVal === 'number' ? dateObj.toLocaleDateString() : fechaVal,
                                    Brutos: getInt(row[iBrutos]),
                                    Retenido: getInt(row[iRetenido]),
                                    Pagado: getInt(row[iPagado])
                                });
                            }
                        }
                        continue; 
                    }

                    // --- 2. LECTURA CSV DE RCV DEL SII ---
                    const match = file.name.match(/_(\d{4})(\d{2})(?:\s*\(\d+\))?\.csv$/i);
                    let mesStr = "Desconocido";
                    if (match) {
                        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                        mesStr = `${monthNames[parseInt(match[2]) - 1]} ${match[1]}`;
                    } else {
                        const fallbackMatch = file.name.match(/(202[0-9])(0[1-9]|1[0-2])/);
                        if (fallbackMatch) {
                            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                            mesStr = `${monthNames[parseInt(fallbackMatch[2]) - 1]} ${fallbackMatch[1]}`;
                        }
                    }

                    const parsed = await parseCSV(file);
                    if (!parsed) continue;

                    if (file.name.includes('RESUMEN_VENTA')) {
                        parsed.data.forEach(row => {
                            if (row['Tipo Documento']) {
                                newResumenVentas.push({
                                    Mes: mesStr,
                                    Tipo: row['Tipo Documento'],
                                    Documentos: getInt(row['Total Documentos']),
                                    Neto: getInt(row['Monto Neto']),
                                    Total: getInt(row['Monto Total'])
                                });
                            }
                        });
                    } else if (file.name.includes('COMPRA_REGISTRO')) {
                        parsed.data.forEach(row => {
                            const tipoDocStr = String(row['Tipo Doc']).trim();
                            if (row['RUT Proveedor'] && (tipoDocStr === '33' || tipoDocStr === '914')) {
                                newDetalleCompras.push({
                                    Mes: mesStr,
                                    Rut: row['RUT Proveedor'],
                                    RazonSocial: row['Razon Social'] || row['Razón Social'],
                                    Fecha: row['Fecha Docto'],
                                    Neto: getInt(row['Monto Neto']),
                                    Total: getInt(row['Monto Total']),
                                    TipoDoc: tipoDocStr
                                });
                            }
                        });
                    } else if (file.name.includes('RCV_VENTA_')) {
                        parsed.data.forEach(row => {
                            if (row['Rut cliente'] || row['RUT Cliente']) {
                                newDetalleVentas.push({
                                    Mes: mesStr,
                                    Rut: row['Rut cliente'] || row['RUT Cliente'],
                                    RazonSocial: row['Razon Social'] || row['Razón Social'],
                                    Fecha: row['Fecha Docto'],
                                    Neto: getInt(row['Monto Neto']),
                                    Total: getInt(row['Monto total'] || row['Monto Total']),
                                    TipoDoc: row['Tipo Doc']
                                });
                            }
                        });
                    }
                }

                if (newResumenVentas.length > 0) {
                    const mesesAfectados = new Set(newResumenVentas.map(d => d.Mes));
                    setDataVentasResumen(prev => [...prev.filter(d => !mesesAfectados.has(d.Mes)), ...newResumenVentas]);
                }
                if (newDetalleVentas.length > 0) {
                    const mesesAfectados = new Set(newDetalleVentas.map(d => d.Mes));
                    setDataVentasDetalle(prev => [...prev.filter(d => !mesesAfectados.has(d.Mes)), ...newDetalleVentas]);
                }
                if (newDetalleCompras.length > 0) {
                    const mesesAfectados = new Set(newDetalleCompras.map(d => d.Mes));
                    setDataComprasDetalle(prev => [...prev.filter(d => !mesesAfectados.has(d.Mes)), ...newDetalleCompras]);
                }
                if (newHonorarios.length > 0) {
                    const mesesAfectados = new Set(newHonorarios.map(d => d.Mes));
                    setDataHonorarios(prev => [...prev.filter(d => !mesesAfectados.has(d.Mes)), ...newHonorarios]);
                }

                setLoading(false);
                event.target.value = '';
            };

            const handleDeleteMonth = () => {
                if (selectedMonth === 'Todos') {
                    if (confirm("¿Borrar TODOS los datos de todos los meses?")) {
                        setDataVentasResumen([]);
                        setDataVentasDetalle([]);
                        setDataComprasDetalle([]);
                        setDataHonorarios([]);
                    }
                    return;
                }
                if (confirm(`¿Borrar los datos registrados de ${selectedMonth}?`)) {
                    setDataVentasResumen(prev => prev.filter(d => d.Mes !== selectedMonth));
                    setDataVentasDetalle(prev => prev.filter(d => d.Mes !== selectedMonth));
                    setDataComprasDetalle(prev => prev.filter(d => d.Mes !== selectedMonth));
                    setDataHonorarios(prev => prev.filter(d => d.Mes !== selectedMonth));
                    setSelectedMonth('Todos');
                }
            };

            const handleDownloadPDF = () => {
                setIsExporting(true);
                setTimeout(() => {
                    const element = document.getElementById('report-content');
                    const filenameStr = selectedMonth !== 'Todos' ? `Informe_Contable_${selectedMonth.replace(' ', '_')}.pdf` : 'Informe_Contable_Total.pdf';
                    const opt = {
                        margin: [0.4, 0.4], // Márgenes superior/inferior y laterales
                        filename: filenameStr,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, windowWidth: 800 }, // Forzamos a html2canvas a interpretar la pantalla con ancho estándar
                        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
                        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] } // Evita cortes a la mitad de las tablas
                    };
                    // Asegurar que use html2pdf nativo si está disponible
                    if (window.html2pdf) {
                        window.html2pdf().set(opt).from(element).save().then(() => {
                            setIsExporting(false);
                        });
                    } else if (typeof html2pdf !== 'undefined') {
                        html2pdf().set(opt).from(element).save().then(() => {
                            setIsExporting(false);
                        });
                    } else {
                        console.error('html2pdf is not loaded');
                        setIsExporting(false);
                        alert("Hubo un problema al cargar la librería de PDF.");
                    }
                }, 800); // Dar más tiempo para re-renderizado
            };

            const availableMonths = useMemo(() => {
                const allMonths = [...dataVentasResumen.map(d=>d.Mes), ...dataVentasDetalle.map(d=>d.Mes), ...dataComprasDetalle.map(d=>d.Mes), ...dataHonorarios.map(d=>d.Mes)];
                return ['Todos', ...Array.from(new Set(allMonths)).sort((a,b) => getMonthValue(a)-getMonthValue(b))];
            }, [dataVentasResumen, dataVentasDetalle, dataComprasDetalle, dataHonorarios]);

            useEffect(() => {
                if (selectedMonth === 'Todos' && availableMonths.length > 1) {
                    setSelectedMonth(availableMonths[availableMonths.length - 1]);
                }
            }, [availableMonths]);

            // --- PROCESAMIENTO DE DATOS PARA GRÁFICO (Evolución Mensual Integrada) ---
            const chartData = useMemo(() => {
                const months = availableMonths.filter(m => m !== 'Todos');
                const labels = [];
                const ventas = [];
                const comprasYHonorarios = [];
                const comprasYHonorariosYDin = [];
                const utilidades = [];

                months.forEach(m => {
                    labels.push(m);
                    
                    // Ventas Netas del Mes
                    const resVentasMes = dataVentasResumen.filter(d => d.Mes === m);
                    let vNeto = 0;
                    resVentasMes.forEach(r => {
                        const t = String(r.Tipo).toLowerCase();
                        if (t.includes('(33)') || t.includes('(34)') || t.includes('(43)') || 
                            t.includes('(39)') || t.includes('(41)') || t.includes('(48)')) {
                            vNeto += r.Neto;
                        } else if (t.includes('(61)')) {
                            vNeto -= r.Neto;
                        }
                    });
                    ventas.push(vNeto);

                    // Compras Netas Solo Tipo 33 + Honorarios
                    const detComprasMes = dataComprasDetalle.filter(d => d.Mes === m && d.TipoDoc === '33');
                    const cNeto33 = detComprasMes.reduce((acc, curr) => acc + curr.Neto, 0);
                    
                    const honMes = dataHonorarios.filter(d => d.Mes === m);
                    const hBruto = honMes.reduce((acc, curr) => acc + curr.Brutos, 0);
                    
                    const totalGastosSinDin = cNeto33 + hBruto;
                    comprasYHonorarios.push(totalGastosSinDin);

                    // Gastos Totales: + DIN
                    const detComprasMesDIN = dataComprasDetalle.filter(d => d.Mes === m && d.TipoDoc === '914');
                    const cNetoDIN = detComprasMesDIN.reduce((acc, curr) => acc + curr.Neto, 0);

                    const totalGastosMesConDin = totalGastosSinDin + cNetoDIN;
                    comprasYHonorariosYDin.push(totalGastosMesConDin);

                    // Utilidad (Sin considerar Compras Tipo 914)
                    utilidades.push(vNeto - totalGastosSinDin);
                });

                return { labels, ventas, compras: comprasYHonorarios, comprasConDin: comprasYHonorariosYDin, utilidades };
            }, [availableMonths, dataVentasResumen, dataComprasDetalle, dataHonorarios]);

            const processedData = useMemo(() => {
                const resVentas = dataVentasResumen.filter(d => selectedMonth === 'Todos' || d.Mes === selectedMonth);
                const detVentas = dataVentasDetalle.filter(d => selectedMonth === 'Todos' || d.Mes === selectedMonth);
                const detCompras = dataComprasDetalle.filter(d => selectedMonth === 'Todos' || d.Mes === selectedMonth);
                const detHonorarios = dataHonorarios.filter(d => selectedMonth === 'Todos' || d.Mes === selectedMonth);

                let facturas = { docs: 0, neto: 0, total: 0 };
                let boletas = { docs: 0, neto: 0, total: 0 };
                let notasCredito = { docs: 0, neto: 0, total: 0 };

                resVentas.forEach(r => {
                    const tipoStr = String(r.Tipo).toLowerCase();
                    if (tipoStr.includes('(33)') || tipoStr.includes('(34)') || tipoStr.includes('(43)')) {
                        facturas.docs += r.Documentos; facturas.neto += r.Neto; facturas.total += r.Total;
                    } else if (tipoStr.includes('(39)') || tipoStr.includes('(41)') || tipoStr.includes('(48)')) {
                        boletas.docs += r.Documentos; boletas.neto += r.Neto; boletas.total += r.Total;
                    } else if (tipoStr.includes('(61)')) {
                        notasCredito.docs += r.Documentos; notasCredito.neto += r.Neto; notasCredito.total += r.Total;
                    }
                });

                const totalIngresos = {
                    neto: facturas.neto + boletas.neto - notasCredito.neto,
                    total: facturas.total + boletas.total - notasCredito.total
                };

                let honorarios = { docs: 0, brutos: 0, retenido: 0, pagado: 0 };
                detHonorarios.forEach(h => {
                    honorarios.docs += 1;
                    honorarios.brutos += h.Brutos;
                    honorarios.retenido += h.Retenido;
                    honorarios.pagado += h.Pagado;
                });

                let compras33 = { docs: 0, neto: 0, total: 0 };
                let comprasDIN = { docs: 0, neto: 0, total: 0 };
                const detCompras33 = [];
                const detComprasDIN = [];

                detCompras.forEach(c => {
                    if (c.TipoDoc === '33') {
                        compras33.docs += 1;
                        compras33.neto += c.Neto;
                        compras33.total += c.Total;
                        detCompras33.push(c);
                    } else if (c.TipoDoc === '914') {
                        comprasDIN.docs += 1;
                        comprasDIN.neto += c.Neto;
                        comprasDIN.total += c.Total;
                        detComprasDIN.push(c);
                    }
                });

                const totalGastos = {
                    neto: compras33.neto + honorarios.brutos,
                    total: compras33.total + honorarios.pagado
                };

                const utilidad = {
                    neto: totalIngresos.neto - totalGastos.neto,
                    total: totalIngresos.total - totalGastos.total
                };

                // Lógica para Top 5 Costos (Compras 33 + Honorarios)
                const gastosPorProveedorMap = {};
                detCompras33.forEach(c => {
                    const name = c.RazonSocial || 'Sin Razón Social';
                    gastosPorProveedorMap[name] = (gastosPorProveedorMap[name] || 0) + c.Neto;
                });
                detHonorarios.forEach(h => {
                    const name = h.RazonSocial || 'Sin Razón Social';
                    gastosPorProveedorMap[name] = (gastosPorProveedorMap[name] || 0) + h.Brutos;
                });
                
                const sortedGastos = Object.entries(gastosPorProveedorMap).sort((a, b) => b[1] - a[1]);
                const top5Gastos = sortedGastos.slice(0, 5);
                const otrosGastos = sortedGastos.slice(5).reduce((acc, curr) => acc + curr[1], 0);
                
                if (otrosGastos > 0) {
                    top5Gastos.push(['Otros', otrosGastos]);
                }
                
                const gastosChartLabels = top5Gastos.map(g => g[0]);
                const gastosChartData = top5Gastos.map(g => g[1]);

                return { 
                    facturas, boletas, notasCredito, totalIngresos, honorarios, 
                    compras33, comprasDIN, totalGastos, utilidad, 
                    detVentas, detCompras33, detComprasDIN, detHonorarios,
                    gastosChartLabels, gastosChartData
                };

            }, [dataVentasResumen, dataVentasDetalle, dataComprasDetalle, dataHonorarios, selectedMonth]);

            // Lógica para el filtro de proveedores (Tabla 4)
            const uniqueProveedores = useMemo(() => {
                if (!processedData) return ['Todos'];
                const provs = processedData.detCompras33.map(c => c.RazonSocial || 'Sin Razón Social');
                return ['Todos', ...Array.from(new Set(provs)).sort()];
            }, [processedData]);

            const filteredCompras33 = useMemo(() => {
                if (!processedData) return [];
                if (selectedProveedor === 'Todos') return processedData.detCompras33;
                return processedData.detCompras33.filter(c => (c.RazonSocial || 'Sin Razón Social') === selectedProveedor);
            }, [processedData, selectedProveedor]);

            const filteredCompras33Totals = useMemo(() => {
                return filteredCompras33.reduce((acc, curr) => {
                    acc.neto += curr.Neto;
                    acc.total += curr.Total;
                    return acc;
                }, { neto: 0, total: 0 });
            }, [filteredCompras33]);

            const hasData = dataVentasResumen.length > 0 || dataVentasDetalle.length > 0 || dataComprasDetalle.length > 0 || dataHonorarios.length > 0;

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-7xl mx-auto space-y-6">
                        
                        {/* CABECERA (No visible al exportar a PDF) */}
                        {!isExporting && (
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="bg-blue-600 p-3 rounded-xl text-white shadow-md">
                                        <IconBuilding />
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-black text-slate-800 tracking-tight">Visor Contable SII</h1>
                                        <p className="text-sm text-slate-500 font-medium">Contabilidad Simple &bull; RCV &bull; Honorarios &bull; DIN</p>
                                    </div>
                                </div>
                                
                                <div className="flex gap-3 items-center w-full md:w-auto flex-wrap justify-center">
                                    {hasData && (
                                        <>
                                            <div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-lg p-1.5 px-3">
                                                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider mr-2">Mes:</span>
                                                <select 
                                                    className="bg-transparent text-sm font-bold text-slate-800 outline-none cursor-pointer"
                                                    value={selectedMonth} 
                                                    onChange={e => setSelectedMonth(e.target.value)}
                                                >
                                                    {availableMonths.map(m => <option key={m} value={m}>{m}</option>)}
                                                </select>
                                                <button onClick={handleDeleteMonth} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded-md ml-2 transition-colors" title="Borrar mes actual">
                                                    <IconTrash />
                                                </button>
                                            </div>
                                            <button 
                                                onClick={handleDownloadPDF} 
                                                className="bg-slate-800 text-white hover:bg-slate-700 px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm text-sm"
                                            >
                                                <IconDownload />
                                                Descargar Informe PDF
                                            </button>
                                        </>
                                    )}

                                    <label className="cursor-pointer bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 flex items-center gap-2 text-sm font-bold transition-all shadow-sm flex-1 md:flex-none justify-center">
                                        {loading ? <span className="animate-pulse">Cargando...</span> : <><IconUpload /> Subir Archivos</>}
                                        <input type="file" multiple accept=".csv, .xlsx, .xls" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                            </div>
                        )}

                        {!hasData && (
                            <div className="bg-white rounded-2xl border-2 border-dashed border-slate-300 py-24 flex flex-col items-center text-center">
                                <div className="text-slate-300 mb-4"><IconBuilding /></div>
                                <h3 className="text-xl font-bold text-slate-700 mb-2">Sube tus archivos del SII</h3>
                                <p className="text-slate-500 max-w-md text-sm">
                                    Sube los archivos <b>RCV_RESUMEN_VENTA</b>, <b>RCV_VENTA</b>, <b>RCV_COMPRA_REGISTRO</b> (en CSV) o el <b>Informe BH</b> (Excel) para comenzar a visualizar los ingresos y gastos mensuales.
                                </p>
                            </div>
                        )}

                        {hasData && processedData && (
                            <div id="report-content" className={`${isExporting ? 'bg-white text-slate-900 mx-auto px-4 py-2 space-y-4' : 'space-y-8'}`} style={{ width: isExporting ? '760px' : '100%' }}>
                                
                                {/* Título de Exportación (solo visible en PDF) */}
                                {isExporting && (
                                    <div className="border-b-2 border-slate-800 pb-2 mb-4 flex justify-between items-end">
                                        <div>
                                            <h1 className="text-2xl font-black text-slate-800">Informe Contable SII</h1>
                                            <p className="text-slate-500 font-medium text-xs mt-1">Resumen de Operaciones Comerciales</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-xs font-bold text-slate-500 uppercase">Periodo</p>
                                            <p className="text-lg font-black text-slate-800">{selectedMonth}</p>
                                        </div>
                                    </div>
                                )}

                                {/* ---------------- SECCIÓN RESUMEN Y GASTOS (UNA SOLA VENTANA) ---------------- */}
                                <div>
                                    {!isExporting && (
                                        <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                            <IconTrendingUp /> Resumen del Periodo <span className="text-slate-400 text-sm font-normal">({selectedMonth})</span>
                                        </h2>
                                    )}
                                    
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                        
                                        {/* INGRESOS */}
                                        <div className={`bg-slate-50 border-b border-slate-200 ${isExporting ? 'p-2' : 'p-4'}`}>
                                            <h3 className="font-bold text-slate-800 uppercase text-sm tracking-wide">1. Detalle de Ingresos</h3>
                                        </div>
                                        <div className="p-0 overflow-x-auto">
                                            <table className="w-full text-left border-collapse text-sm min-w-[600px]">
                                                <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase text-xs">
                                                    <tr>
                                                        <th className={`font-semibold w-1/4 ${isExporting ? 'p-2' : 'p-4'}`}>Concepto</th>
                                                        <th className={`font-semibold text-center w-1/4 ${isExporting ? 'p-2' : 'p-4'}`}>Documentos</th>
                                                        <th className={`font-semibold text-right w-1/4 ${isExporting ? 'p-2' : 'p-4'}`}>Monto Neto</th>
                                                        <th className={`font-semibold text-right w-1/4 ${isExporting ? 'p-2' : 'p-4'}`}>Monto Total</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className={`flex items-center gap-3 font-medium text-blue-600 ${isExporting ? 'p-2' : 'p-4'}`}><IconInvoice /> Facturas</td>
                                                        <td className={`text-center text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{processedData.facturas.docs} emitidos</td>
                                                        <td className={`text-right text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.facturas.neto)}</td>
                                                        <td className={`text-right font-bold text-slate-800 ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.facturas.total)}</td>
                                                    </tr>
                                                    <tr className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className={`flex items-center gap-3 font-medium text-emerald-600 ${isExporting ? 'p-2' : 'p-4'}`}><IconReceipt /> Boletas</td>
                                                        <td className={`text-center text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{processedData.boletas.docs} emitidos</td>
                                                        <td className={`text-right text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.boletas.neto)}</td>
                                                        <td className={`text-right font-bold text-slate-800 ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.boletas.total)}</td>
                                                    </tr>
                                                    <tr className="border-b border-slate-200 hover:bg-slate-50 transition-colors">
                                                        <td className={`flex items-center gap-3 font-medium text-red-500 ${isExporting ? 'p-2' : 'p-4'}`}><IconCreditNote /> Notas de Crédito</td>
                                                        <td className={`text-center text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{processedData.notasCredito.docs} emitidos</td>
                                                        <td className={`text-right text-red-500 ${isExporting ? 'p-2' : 'p-4'}`}>-{formatCurrency(processedData.notasCredito.neto)}</td>
                                                        <td className={`text-right font-bold text-red-600 ${isExporting ? 'p-2' : 'p-4'}`}>-{formatCurrency(processedData.notasCredito.total)}</td>
                                                    </tr>
                                                    <tr className="bg-slate-800 text-white">
                                                        <td className={`font-bold text-blue-300 ${isExporting ? 'p-2' : 'p-4'}`}>TOTAL INGRESOS</td>
                                                        <td className={`text-center font-bold text-slate-300 ${isExporting ? 'p-2' : 'p-4'}`}>{processedData.facturas.docs + processedData.boletas.docs + processedData.notasCredito.docs}</td>
                                                        <td className={`text-right font-bold ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.totalIngresos.neto)}</td>
                                                        <td className={`text-right font-black text-emerald-400 ${isExporting ? 'p-2 text-base' : 'p-4 text-lg'}`}>{formatCurrency(processedData.totalIngresos.total)}</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>

                                        {/* GASTOS */}
                                        <div className={`bg-slate-50 border-y border-slate-200 ${isExporting ? 'p-2 mt-2' : 'p-4 mt-4'}`}>
                                            <h3 className="font-bold text-slate-800 uppercase text-sm tracking-wide">2. Detalle de Gastos (Operativos)</h3>
                                        </div>
                                        <div className="p-0 overflow-x-auto">
                                            <table className="w-full text-left border-collapse text-sm min-w-[600px]">
                                                <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase text-xs">
                                                    <tr>
                                                        <th className={`font-semibold w-1/4 ${isExporting ? 'p-2' : 'p-4'}`}>Concepto</th>
                                                        <th className={`font-semibold text-center w-1/4 ${isExporting ? 'p-2' : 'p-4'}`}>Documentos</th>
                                                        <th className={`font-semibold text-right w-1/4 ${isExporting ? 'p-2' : 'p-4'}`}>Monto Neto / Bruto</th>
                                                        <th className={`font-semibold text-right w-1/4 ${isExporting ? 'p-2' : 'p-4'}`}>Monto Total / Pagado</th>
                                                    </tr>

                                                <tbody>
                                                    <tr className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className={`flex items-center gap-3 font-medium text-purple-600 ${isExporting ? 'p-2' : 'p-4'}`}><IconShoppingCart /> Compras (Facturas)</td>
                                                        <td className={`text-center text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{processedData.compras33.docs} recibidos</td>
                                                        <td className={`text-right text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.compras33.neto)}</td>
                                                        <td className={`text-right font-bold text-slate-800 ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.compras33.total)}</td>
                                                    </tr>
                                                    <tr className="border-b border-slate-200 hover:bg-slate-50 transition-colors">
                                                        <td className={`flex items-center gap-3 font-medium text-amber-600 ${isExporting ? 'p-2' : 'p-4'}`}><IconBriefcase /> Honorarios (BH)</td>
                                                        <td className={`text-center text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{processedData.honorarios.docs} recibidos</td>
                                                        <td className={`text-right text-slate-600 ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.honorarios.brutos)}</td>
                                                        <td className={`text-right font-bold text-slate-800 ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.honorarios.pagado)}</td>
                                                    </tr>
                                                    <tr className="bg-slate-800 text-white">
                                                        <td className={`font-bold text-rose-300 ${isExporting ? 'p-2' : 'p-4'}`}>TOTAL GASTOS</td>
                                                        <td className={`text-center font-bold text-slate-300 ${isExporting ? 'p-2' : 'p-4'}`}>{processedData.compras33.docs + processedData.honorarios.docs}</td>
                                                        <td className={`text-right font-bold ${isExporting ? 'p-2' : 'p-4'}`}>{formatCurrency(processedData.totalGastos.neto)}</td>
                                                        <td className={`text-right font-black text-rose-400 ${isExporting ? 'p-2 text-base' : 'p-4 text-lg'}`}>{formatCurrency(processedData.totalGastos.total)}</td>
                                                    </tr>
                                                    {/* UTILIDAD DEL PERÍODO */}
                                                    <tr className="bg-slate-950 text-white border-t-4 border-slate-700">
                                                        <td className={`font-black tracking-wide text-white uppercase text-base ${isExporting ? 'p-2' : 'p-4'}`}>
                                                            <div className="flex flex-col">
                                                                <span className={isExporting ? 'text-sm' : ''}>UTILIDAD DEL PERÍODO</span>
                                                                <span className="text-[9px] text-slate-400 font-normal normal-case tracking-normal">(Sin Importaciones DIN 914)</span>
                                                            </div>
                                                        </td>
                                                        <td className={`text-center font-bold text-slate-400 ${isExporting ? 'p-2' : 'p-4'}`}>-</td>
                                                        <td className={`text-right font-bold ${processedData.utilidad.neto >= 0 ? 'text-emerald-400' : 'text-red-400'} ${isExporting ? 'p-2' : 'p-4'}`}>
                                                            {formatCurrency(processedData.utilidad.neto)}
                                                        </td>
                                                        <td className={`text-right font-black ${processedData.utilidad.total >= 0 ? 'text-emerald-400' : 'text-red-400'} ${isExporting ? 'p-2 text-lg' : 'p-4 text-xl'}`}>
                                                            {formatCurrency(processedData.utilidad.total)}

                                    </div>
                                </div>

                                {/* ---------------- SECCIÓN GRÁFICOS DE EVOLUCIÓN ---------------- */}
                                {chartData && chartData.labels.length > 0 && (
                                    <div className={`w-full ${isExporting ? 'space-y-3' : 'space-y-6'}`}>
                                        <h2 className={`font-bold text-slate-800 flex items-center gap-2 ${isExporting ? 'text-base mb-1' : 'text-lg mb-4'}`}>
                                            Evolución Anual (Neto)
                                        </h2>
                                        
                                        <MultiLineChart 
                                            title="Ingresos, Gastos y Utilidad del Ejercicio" 
                                            labels={chartData.labels} 
                                            datasets={[
                                                { label: "Ventas Netas", data: chartData.ventas, borderColor: "#3b82f6", bgColor: "transparent", fill: false },
                                                { label: "Gastos Totales (Compras + Honorarios)", data: chartData.compras, borderColor: "#f43f5e", bgColor: "transparent", fill: false },
                                                { label: "Utilidad (Sin DIN)", data: chartData.utilidades, borderColor: "#10b981", bgColor: "rgba(16, 185, 129, 0.1)", fill: true }
                                            ]}
                                            isExporting={isExporting}
                                        />

                                        <div className={`grid ${isExporting ? 'grid-cols-2 gap-4' : 'grid-cols-1 lg:grid-cols-2 gap-6'}`}>
                                            <MultiLineChart 
                                                title="Evolución de Gastos con Importaciones (DIN)" 
                                                labels={chartData.labels} 
                                                datasets={[
                                                    { label: "Gastos (Solo Compras Locales + Honorarios)", data: chartData.compras, borderColor: "#f43f5e", bgColor: "transparent", fill: false },
                                                    { label: "Gastos (Incluyendo Importaciones DIN)", data: chartData.comprasConDin, borderColor: "#8b5cf6", bgColor: "rgba(139, 92, 246, 0.1)", fill: true }
                                                ]}
                                                isExporting={isExporting}
                                            />

                                            <MultiLineChart 
                                                title="Evolución de Ventas Netas Mensuales" 
                                                labels={chartData.labels} 
                                                datasets={[
                                                    { label: "Ventas Netas", data: chartData.ventas, borderColor: "#3b82f6", bgColor: "rgba(59, 130, 246, 0.1)", fill: true }
                                                ]}
                                                isExporting={isExporting}
                                            />
                                        </div>
                                    </div>
                                )}

                                {/* ---------------- SECCIÓN TABLAS DETALLE ---------------- */}
                                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                                    
                                    {/* TABLA: DETALLE DE VENTAS */}
                                    <CollapsibleTable title="3. Detalle de Ventas" count={processedData.detVentas.length} isExporting={isExporting}>
                                            {processedData.detVentas.length > 0 ? (
                                                <table className="w-full text-left border-collapse text-xs">
                                                    <thead className="bg-white sticky top-0 shadow-sm z-10">
                                                        <tr className="text-slate-500 uppercase">
                                                            <th className="p-3 border-b font-semibold whitespace-nowrap">RUT Cliente</th>
                                                            <th className="p-3 border-b font-semibold">Razón Social</th>
                                                            <th className="p-3 border-b font-semibold whitespace-nowrap">Fecha</th>
                                                            <th className="p-3 border-b font-semibold text-right">M. Neto</th>
                                                            <th className="p-3 border-b font-semibold text-right">M. Total</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {processedData.detVentas.map((v, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-50 border-b border-slate-100 last:border-0">
                                                                <td className="p-3 text-slate-600 whitespace-nowrap">{v.Rut}</td>
                                                                <td className="p-3 font-medium text-slate-800 truncate max-w-[150px]" title={v.RazonSocial}>{v.RazonSocial || 'Sin Razón Social'}</td>
                                                                <td className="p-3 text-slate-500 whitespace-nowrap">{v.Fecha}</td>
                                                                <td className="p-3 text-right text-slate-600">{formatCurrency(v.Neto)}</td>
                                                                <td className="p-3 text-right font-bold text-slate-800">{formatCurrency(v.Total)}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            ) : (
                                                <div className="h-full flex items-center justify-center text-slate-400 text-sm p-6">
                                                    Sube el archivo RCV_VENTA para ver el detalle.
                                                </div>
                                            )}
                                    </CollapsibleTable>

                                    {/* TABLA: REGISTRO DE COMPRAS (SÓLO 33) */}
                                    <CollapsibleTable title="4. Registro de Compras (Locales)" count={filteredCompras33.length} isExporting={isExporting}>
                                            {processedData.detCompras33.length > 0 ? (
                                                <div className="flex flex-col h-full">
                                                    {!isExporting && (
                                                        <div className="p-2 bg-white border-b border-slate-200 flex items-center gap-2">
                                                            <span className="text-xs font-bold text-slate-500 uppercase ml-1">Filtro Proveedor:</span>
                                                            <select 
                                                                className="bg-slate-50 border border-slate-200 text-xs font-medium text-slate-700 rounded-md p-1.5 flex-1 max-w-[250px] outline-none cursor-pointer"
                                                                value={selectedProveedor}
                                                                onChange={(e) => setSelectedProveedor(e.target.value)}
                                                            >
                                                                {uniqueProveedores.map(p => <option key={p} value={p}>{p}</option>)}
                                                            </select>
                                                        </div>
                                                    )}
                                                    <table className="w-full text-left border-collapse text-xs">
                                                        <thead className="bg-white sticky top-0 shadow-sm z-10">
                                                            <tr className="text-slate-500 uppercase">
                                                                <th className="p-3 border-b font-semibold">Razón Social (Proveedor)</th>
                                                                <th className="p-3 border-b font-semibold whitespace-nowrap">Fecha Docto</th>
                                                                <th className="p-3 border-b font-semibold text-center">Tipo Doc</th>
                                                                <th className="p-3 border-b font-semibold text-right">M. Neto</th>
                                                                <th className="p-3 border-b font-semibold text-right">M. Total</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {filteredCompras33.map((c, idx) => (
                                                                <tr key={idx} className="hover:bg-slate-50 border-b border-slate-100 last:border-0">
                                                                    <td className="p-3 font-medium text-slate-800 truncate max-w-[150px]" title={c.RazonSocial}>{c.RazonSocial || 'Sin Razón Social'}</td>
                                                                    <td className="p-3 text-slate-500 whitespace-nowrap">{c.Fecha}</td>
                                                                    <td className="p-3 text-center">
                                                                        <span className="px-2 py-1 rounded text-[10px] font-bold bg-slate-100 text-slate-600">Factura (33)</span>
                                                                    </td>
                                                                    <td className="p-3 text-right text-slate-600">{formatCurrency(c.Neto)}</td>
                                                                    <td className="p-3 text-right font-bold text-slate-800">{formatCurrency(c.Total)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                        {selectedProveedor !== 'Todos' && (
                                                            <tfoot className="bg-slate-100 font-bold sticky bottom-0 z-10 shadow-[0_-2px_4px_rgba(0,0,0,0.05)]">
                                                                <tr>
                                                                    <td colSpan="3" className="p-3 text-right text-slate-700 uppercase tracking-wide">Total Seleccionado:</td>
                                                                    <td className="p-3 text-right text-slate-800">{formatCurrency(filteredCompras33Totals.neto)}</td>
                                                                    <td className="p-3 text-right text-slate-800 text-sm">{formatCurrency(filteredCompras33Totals.total)}</td>
                                                                </tr>
                                                            </tfoot>
                                                        )}
                                                    </table>
                                                </div>
                                            ) : (
                                                <div className="h-full flex items-center justify-center text-slate-400 text-sm p-6">
                                                    Sube el archivo RCV_COMPRA_REGISTRO para ver el detalle de facturas.
                                                </div>
                                            )}
                                    </CollapsibleTable>

                                </div>

                                {/* ---------------- GRÁFICO CIRCULAR DE GASTOS ---------------- */}
                                {processedData.gastosChartData && processedData.gastosChartData.length > 0 && (
                                    <div className="mt-6 w-full lg:w-3/4 mx-auto">
                                        <DoughnutChart 
                                            title="Distribución de Costos Operativos (Top 5 Proveedores)" 
                                            labels={processedData.gastosChartLabels} 
                                            data={processedData.gastosChartData} 
                                            isExporting={isExporting} 
                                        />
                                    </div>
                                )}

                                {/* ---------------- TABLA EXCLUSIVA PARA DIN 914 ---------------- */}
                                <div className="mt-6">
                                    <CollapsibleTable title="5. Gastos de Importaciones (DIN 914)" count={processedData.detComprasDIN.length} isExporting={isExporting}>
                                            {processedData.detComprasDIN.length > 0 ? (
                                                <table className="w-full text-left border-collapse text-xs">
                                                    <thead className="bg-white sticky top-0 shadow-sm z-10">
                                                        <tr className="text-slate-500 uppercase">
                                                            <th className="p-3 border-b font-semibold">Razón Social</th>
                                                            <th className="p-3 border-b font-semibold whitespace-nowrap">Fecha Docto</th>
                                                            <th className="p-3 border-b font-semibold text-center">Tipo Doc</th>
                                                            <th className="p-3 border-b font-semibold text-right">M. Neto</th>
                                                            <th className="p-3 border-b font-semibold text-right">M. Total</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {processedData.detComprasDIN.map((c, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-50 border-b border-slate-100 last:border-0">
                                                                <td className="p-3 font-medium text-slate-800 truncate max-w-[250px]" title={c.RazonSocial}>{c.RazonSocial || 'Sin Razón Social'}</td>
                                                                <td className="p-3 text-slate-500 whitespace-nowrap">{c.Fecha}</td>
                                                                <td className="p-3 text-center">
                                                                    <span className="px-2 py-1 rounded text-[10px] font-bold bg-cyan-100 text-cyan-700">DIN (914)</span>
                                                                </td>
                                                                <td className="p-3 text-right text-slate-600">{formatCurrency(c.Neto)}</td>
                                                                <td className="p-3 text-right font-bold text-slate-800">{formatCurrency(c.Total)}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            ) : (
                                                <div className="h-full flex items-center justify-center text-slate-400 text-sm p-6">
                                                    No hay importaciones (DIN 914) en este periodo.
                                                </div>
                                            )}
                                    </CollapsibleTable>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
