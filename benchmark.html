<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varin | Benchmark ML</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librerías de React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS, HTML2PDF y Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICONOS SVG ---
        const IconBarChart = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>;
        const IconUpload = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>;
        const IconDownload = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const IconFilter = ({ className = "", size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const IconPackage = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>;
        const IconFileText = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
        const IconFan = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 0 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 0-7.002 8.618l1.45-5.412Z"/><path d="M12 12v.01"/></svg>;
        const IconTag = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>;
        const IconChevronDown = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>;
        const IconShoppingCart = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>;
        const IconDollarSign = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
        const IconEye = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
        const IconTrendingUp = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;

        const monthMap = { "Enero": 1, "Febrero": 2, "Marzo": 3, "Abril": 4, "Mayo": 5, "Junio": 6, "Julio": 7, "Agosto": 8, "Septiembre": 9, "Octubre": 10, "Noviembre": 11, "Diciembre": 12 };

        const getMonthValue = (mStr) => {
            if (!mStr || mStr === 'Todos') return 0;
            const parts = mStr.split(' ');
            if (parts.length < 2) return 999999;
            return parseInt(parts[1]) * 100 + (monthMap[parts[0]] || 0);
        };

        const TrendChart = ({ data, isExporting }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !data || data.length === 0) return;
                if (chartInstance.current) { chartInstance.current.destroy(); }
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(d => d.month),
                        datasets: [
                            {
                                label: 'Ventas Totales ($)',
                                data: data.map(d => d.sales),
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                yAxisID: 'y-sales',
                                tension: 0.3,
                                fill: true,
                                borderWidth: 2,
                                pointRadius: isExporting ? 2 : 4,
                            },
                            {
                                label: 'Unidades Vendidas',
                                data: data.map(d => d.units),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                yAxisID: 'y-units',
                                tension: 0.3,
                                fill: true,
                                borderWidth: 2,
                                pointRadius: isExporting ? 2 : 4,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            legend: { position: 'top', labels: { boxWidth: 12, font: { size: isExporting ? 9 : 12 } } }
                        },
                        scales: {
                            'y-units': { type: 'linear', position: 'left', ticks: { font: { size: isExporting ? 8 : 11 } } },
                            'y-sales': { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { size: isExporting ? 8 : 11 }, callback: (v) => '$' + (v / 1000000 >= 1 ? (v/1000000).toFixed(1) + 'M' : v.toLocaleString('es-CL')) } }
                        }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data, isExporting]);

            return <div className={`w-full ${isExporting ? 'h-32' : 'h-64'}`}><canvas ref={chartRef}></canvas></div>;
        };

            const CollapsibleCard = ({ title, icon, children, forceOpen, isExporting }) => {
            const [isOpen, setIsOpen] = useState(false);
            const displayOpen = forceOpen || isOpen;
            return (
                <div className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col ${isExporting ? '!shadow-none !border-slate-300' : ''}`}>
                    {!isExporting && (
                        <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 transition-colors border-b border-transparent data-[open=true]:border-slate-200">
                            <div className="flex items-center gap-2 font-bold text-slate-800 text-sm">{icon}{title}</div>
                            <div className={`transition-transform duration-200 text-slate-400 ${isOpen ? 'rotate-180' : ''}`}><IconChevronDown /></div>
                        </button>
                    )}
                    {isExporting && <div className="p-1.5 bg-slate-100 border-b border-slate-200 flex items-center gap-1 font-bold text-slate-800 text-xs">{icon}{title}</div>}
                    {displayOpen && <div className={`bg-white ${isExporting ? 'p-2' : 'p-4 border-t border-slate-200'}`}>{children}</div>}
                </div>
            );
        };

        const DonutChart = ({ data }) => {
            if (!data || data.length === 0) return <div className="text-gray-500 text-xs">Sin datos</div>;
            const total = data.reduce((acc, item) => acc + item.value, 0);
            let cumulativePercent = 0;
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#6366f1'];
            const slices = data.map((item, index) => {
                const percent = item.value / total;
                const startAngle = cumulativePercent * 360;
                cumulativePercent += percent;
                const endAngle = cumulativePercent * 360;
                const x1 = Math.cos((startAngle - 90) * (Math.PI / 180));
                const y1 = Math.sin((startAngle - 90) * (Math.PI / 180));
                const x2 = Math.cos((endAngle - 90) * (Math.PI / 180));
                const y2 = Math.sin((endAngle - 90) * (Math.PI / 180));
                const largeArcFlag = percent > 0.5 ? 1 : 0;
                const pathData = [`M ${x1} ${y1}`, `A 1 1 0 ${largeArcFlag} 1 ${x2} ${y2}`, `L 0 0`].join(' ');
                return <path key={index} d={pathData} fill={colors[index % colors.length]} />;
            });
            return (
                <div className="flex items-center gap-4 w-full justify-center">
                    <div className="relative w-20 h-20"><svg viewBox="-1 -1 2 2" className="w-full h-full transform -rotate-90">{slices}<circle cx="0" cy="0" r="0.6" fill="white" /></svg></div>
                    <div className="flex flex-col gap-1 text-[10px] text-gray-600">
                        {data.slice(0, 5).map((item, i) => <div key={i} className="flex items-center gap-1"><span className="w-2 h-2 rounded-full" style={{ backgroundColor: colors[i % colors.length] }}></span><span className="truncate max-w-[80px]">{item.name}: {((item.value/total)*100).toFixed(0)}%</span></div>)}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem('varin_benchmark_data');
                return saved ? JSON.parse(saved) : [];
            });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [selectedMonth, setSelectedMonth] = useState('Todos');
            const [selectedCategory, setSelectedCategory] = useState('Todas');
            const [isExporting, setIsExporting] = useState(false);

            useEffect(() => {
                localStorage.setItem('varin_benchmark_data', JSON.stringify(data));
            }, [data]);

            // Formateadores globales
            const formatNumber = (val) => new Intl.NumberFormat('es-CL').format(val || 0);
            const formatCurrency = (val) => new Intl.NumberFormat('es-CL', {style:'currency', currency:'CLP', maximumFractionDigits:0}).format(val || 0);

            const cleanNumber = (val) => {
                if (typeof val === 'number') return val;
                if (!val || val === '-') return 0;
                let s = String(val).trim().replace(/\$/g, '');
                if (s.includes('.') && s.includes(',')) {
                    s = s.replace(/\./g, '').replace(',', '.');
                } else if (s.includes('.') && s.split('.').pop().length === 3) {
                    s = s.replace(/\./g, '');
                } else if (s.includes(',')) {
                    s = s.replace(/,/g, '.');
                }
                return parseFloat(s) || 0;
            };

            const handleFileUpload = async (event) => {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                setLoading(true);
                setError('');
                try {
                    let newData = [];
                    const targets = ["Electrodomésticos", "Climatización", "Ventiladores", "Eléctricos"];
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const dateMatch = file.name.match(/(\d{4})-(\d{2})-\d{2}/);
                        const monthStr = dateMatch ? `${["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"][parseInt(dateMatch[2])-1]} ${dateMatch[1]}` : "Sin fecha";
                        const buffer = await file.arrayBuffer();
                        const workbook = XLSX.read(buffer, { type: 'array' });
                        workbook.SheetNames.forEach(sheetName => {
                            const searchSource = (sheetName + " " + file.name).toLowerCase();
                            const matchedTarget = targets.find(t => searchSource.includes(t.toLowerCase()));
                            if (matchedTarget) {
                                const category = matchedTarget === "Eléctricos" ? "Heaters" : matchedTarget;
                                const sheetRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });
                                let hIdx = -1;
                                for (let r = 0; r < Math.min(20, sheetRows.length); r++) {
                                    if (!sheetRows[r]) continue;
                                    const rStr = sheetRows[r].join(" ").toLowerCase();
                                    if ((rStr.includes("nom") || rStr.includes("título")) && (rStr.includes("pre") || rStr.includes("valor"))) { hIdx = r; break; }
                                }
                                if (hIdx !== -1) {
                                    const heads = sheetRows[hIdx].map(h => String(h).toLowerCase().trim());
                                    const colMap = {
                                        name: heads.findIndex(h => h.includes("nom") || h.includes("título")),
                                        price: heads.findIndex(h => h.includes("pre") || h.includes("valor")),
                                        units: heads.findIndex(h => h.includes("unidades") || h.includes("vendidas")),
                                        visits: heads.findIndex(h => h.includes("vist") || h.includes("visualiz")),
                                        shipping: heads.findIndex(h => h.includes("enví") || h.includes("fret") || h.includes("envio"))
                                    };
                                    for (let r = hIdx + 1; r < sheetRows.length; r++) {
                                        const row = sheetRows[r];
                                        if (!row || !row[colMap.name]) continue;
                                        newData.push({
                                            Categoria: category,
                                            Mes: monthStr,
                                            Nombre: String(row[colMap.name]),
                                            Precio: cleanNumber(row[colMap.price]),
                                            Unidades: cleanNumber(row[colMap.units]),
                                            Vistas: cleanNumber(row[colMap.visits]),
                                            Envio: row[colMap.shipping] || "No especificado",
                                            Generic: String(row[colMap.name]).split(" ")[0]
                                        });
                                    }
                                }
                            }
                        });
                    }
                    if (newData.length > 0) setData(prev => [...prev, ...newData]);
                    else setError('No se detectaron datos compatibles. Verifica los nombres de las pestañas o columnas.');
                } catch (e) { setError('Error al leer el archivo.'); } finally { setLoading(false); event.target.value = ''; }
            };

            const metrics = useMemo(() => {
                const filtered = data.filter(d => (selectedMonth === 'Todos' || d.Mes === selectedMonth) && (selectedCategory === 'Todas' || d.Categoria === selectedCategory));
                if (filtered.length === 0) return null;
                const prices = filtered.map(d => d.Precio).filter(p => p > 0);
                const totalUnits = filtered.reduce((a, b) => a + b.Unidades, 0);
                const totalSales = filtered.reduce((a, b) => a + (b.Precio * b.Unidades), 0);
                const totalVisits = filtered.reduce((a, b) => a + b.Vistas, 0);
                
                const genericCounts = {};
                filtered.forEach(d => genericCounts[d.Generic] = (genericCounts[d.Generic] || 0) + d.Unidades);
                const topGenerics = Object.entries(genericCounts).sort((a,b) => b[1]-a[1]);
                
                const stopWords = new Set(["de", "la", "el", "en", "y", "a", "los", "las", "un", "una", "con", "para", "por", "su", "al", "lo", "como", "mas", "más", "o", "sin", "cm", "mm", "kg", "w", "watts", "v", "pack", "x", "x2", "x3", "pulgadas", "litros"]);
                const wordCounts = {};
                filtered.forEach(d => {
                    const words = d.Nombre.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g," ").split(/\s+/);
                    words.forEach(w => {
                        if (w.length > 2 && !stopWords.has(w) && isNaN(w)) { wordCounts[w] = (wordCounts[w] || 0) + 1; }
                    });
                });
                const topWords = Object.entries(wordCounts).sort((a, b) => b[1] - a[1]).slice(0, 15);

                const shipCounts = {};
                filtered.forEach(d => shipCounts[d.Envio] = (shipCounts[d.Envio] || 0) + 1);
                const shippingData = Object.entries(shipCounts).map(([name, value]) => ({name, value}));

                let ventTecho = { u: 0, v: 0, min: Infinity, max: -Infinity, sum: 0, c: 0 };
                let ventResto = { u: 0, v: 0, min: Infinity, max: -Infinity, sum: 0, c: 0 };
                filtered.filter(d => d.Categoria === 'Ventiladores').forEach(d => {
                    const target = d.Nombre.toLowerCase().includes("techo") ? ventTecho : ventResto;
                    target.u += d.Unidades; target.v += d.Vistas; target.c++;
                    if(d.Precio > 0) { target.min = Math.min(target.min, d.Precio); target.max = Math.max(target.max, d.Precio); target.sum += d.Precio; }
                });

                return { filtered, totalUnits, totalSales, totalVisits, minP: Math.min(...prices), maxP: Math.max(...prices), avgP: totalSales/totalUnits || 0, topGenerics, topWords, shippingData, ventTecho, ventResto };
            }, [data, selectedMonth, selectedCategory]);

            const trendData = useMemo(() => {
                if (data.length === 0) return [];
                const catFiltered = data.filter(d => selectedCategory === 'Todas' || d.Categoria === selectedCategory);
                const grouped = {};
                const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                const years = Array.from(new Set(data.map(d => d.Mes.split(' ')[1]))).filter(y => y);
                if (years.length === 0) years.push("2026"); 
                years.forEach(y => months.forEach(m => {
                    const key = `${m} ${y}`;
                    grouped[key] = { month: key, units: 0, sales: 0, sortKey: getMonthValue(key) };
                }));
                catFiltered.forEach(d => {
                    if (grouped[d.Mes]) { grouped[d.Mes].units += d.Unidades; grouped[d.Mes].sales += (d.Precio * d.Unidades); }
                });
                return Object.values(grouped).sort((a,b) => a.sortKey - b.sortKey);
            }, [data, selectedCategory]);

            const availableMonths = ['Todos', ...Array.from(new Set(data.map(d => d.Mes))).sort((a,b) => getMonthValue(a)-getMonthValue(b))];

            return (
                <div className="min-h-screen bg-slate-100 text-slate-800 p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        {!isExporting && (
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                                <div>
                                    <h1 className="text-2xl font-bold flex items-center gap-2 text-slate-800"><IconBarChart className="text-blue-600" />Varin | Benchmark ML</h1>
                                    <p className="text-sm text-slate-500 italic">Los datos se guardan localmente para próximas sesiones.</p>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    <label className="cursor-pointer bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2 text-sm transition-colors shadow-sm"><IconUpload /> Subir Archivos<input type="file" multiple accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFileUpload} /></label>
                                    {data.length > 0 && <button onClick={() => { setIsExporting(true); setTimeout(() => { html2pdf().from(document.getElementById('report-content')).set({ margin: 0.3, filename: 'Benchmark_ML.pdf', image: {type: 'jpeg', quality: 0.98}, html2canvas: {scale: 1.5}, jsPDF: {format: 'letter', orientation: 'landscape'} }).save().then(() => setIsExporting(false)); }, 500); }} className="bg-slate-800 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm shadow-sm transition-colors"><IconDownload /> PDF</button>}
                                </div>
                            </div>
                        )}

                        {error && (
                            <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded text-red-700 text-sm flex items-center gap-2">
                                <IconAlert size={16} /> {error}
                            </div>
                        )}

                        {data.length > 0 ? (
                            <>
                                {!isExporting && (
                                    <div className="bg-white rounded-xl p-4 flex flex-wrap gap-6 items-center shadow-sm border border-slate-200">
                                        <div className="flex items-center gap-2 text-slate-600 font-medium"><IconFilter size={18} /> Filtros:</div>
                                        <select className="border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-200" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)}>{availableMonths.map(m => <option key={m} value={m}>{m}</option>)}</select>
                                        <div className="flex bg-slate-100 p-1 rounded-lg">
                                            {['Todas', 'Electrodomésticos', 'Climatización', 'Ventiladores', 'Heaters'].map(c => <button key={c} onClick={() => setSelectedCategory(c)} className={`px-4 py-1.5 text-xs font-bold rounded-md transition-all ${selectedCategory === c ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>{c}</button>)}
                                        </div>
                                    </div>
                                )}

                                <div id="report-content" className={`${isExporting ? 'bg-white space-y-2 p-2' : 'space-y-6'}`}>
                                    <div className={`${isExporting ? 'flex border-b-2 pb-2 justify-between mb-4' : 'hidden'}`}>
                                        <h2 className="text-xl font-bold">Varin | Benchmark ML</h2>
                                        <div className="text-xs text-slate-500 text-right">Período: {selectedMonth} | Categoría: {selectedCategory}</div>
                                    </div>

                                    {metrics && (
                                        <>
                                            <div className={`grid ${isExporting ? 'grid-cols-7 gap-2' : 'grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4'}`}>
                                                {[
                                                    {l: 'Unidades', v: formatNumber(metrics.totalUnits), i: <IconShoppingCart />, c: 'text-blue-600'},
                                                    {l: 'Venta Total', v: formatCurrency(metrics.totalSales), i: <IconDollarSign />, c: 'text-emerald-600', bg: 'bg-emerald-50'},
                                                    {l: 'Visitas', v: formatNumber(metrics.totalVisits), i: <IconEye />, c: 'text-indigo-600'},
                                                    {l: 'Conversión', v: ((metrics.totalUnits/metrics.totalVisits)*100).toFixed(2) + '%', i: <IconTrendingUp />, c: 'text-purple-600', bg: 'bg-indigo-50'},
                                                    {l: 'Precio Mín', v: formatCurrency(metrics.minP)},
                                                    {l: 'Precio Prom', v: formatCurrency(metrics.avgP), b: 'border-b-4 border-blue-500'},
                                                    {l: 'Precio Máx', v: formatCurrency(metrics.maxP)},
                                                ].map((k, i) => (
                                                    <div key={i} className={`bg-white rounded-xl border p-3 flex flex-col justify-center ${k.bg || ''} ${k.b || ''} ${isExporting ? '!p-1.5' : ''}`}>
                                                        <div className={`flex items-center gap-1 text-slate-500 font-bold ${isExporting ? 'text-[8px]' : 'text-[10px]'}`}>{k.i}{k.l}</div>
                                                        <div className={`font-black ${k.c || 'text-slate-800'} ${isExporting ? 'text-xs' : 'text-base'}`}>{k.v}</div>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className={`grid ${isExporting ? 'grid-cols-3 gap-2' : 'grid-cols-1 lg:grid-cols-3 gap-4'}`}>
                                                <CollapsibleCard title="Envío" isExporting={isExporting} forceOpen={isExporting} icon={<IconPackage className="text-emerald-500" />}><DonutChart data={metrics.shippingData} /></CollapsibleCard>
                                                <CollapsibleCard title="Productos Genéricos" isExporting={isExporting} forceOpen={isExporting} icon={<IconFileText className="text-purple-500" />}>
                                                    <div className={isExporting ? "grid grid-cols-2 gap-1 text-[8px]" : "space-y-2 max-h-56 overflow-y-auto no-scrollbar pr-1"}>
                                                        {metrics.topGenerics.map(([t, u], i) => (
                                                            <div key={i} className="flex justify-between border-b border-slate-100 pb-1 text-xs">
                                                                <span className="text-slate-600">{t}</span>
                                                                <span className="font-bold">{formatNumber(u)} u.</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </CollapsibleCard>
                                                <CollapsibleCard title="Palabras más usadas" isExporting={isExporting} forceOpen={isExporting} icon={<IconTag className="text-amber-500" />}>
                                                     <div className={isExporting ? "grid grid-cols-2 gap-1 text-[8px]" : "space-y-2 max-h-56 overflow-y-auto no-scrollbar pr-1"}>
                                                        {metrics.topWords.map(([w, c], i) => (
                                                            <div key={i} className="flex justify-between border-b border-slate-100 pb-1 text-xs">
                                                                <span className="capitalize text-slate-600">{w}</span>
                                                                <span className="font-bold text-amber-600">{formatNumber(c)}</span>
                                                            </div>
                                                        ))}
                                                     </div>
                                                </CollapsibleCard>
                                            </div>

                                            {metrics.ventTecho.c > 0 && (
                                                <div className={`bg-slate-800 text-white rounded-xl p-4 ${isExporting ? '!p-2 text-[9px]' : ''}`}>
                                                    <h3 className="font-bold mb-3 flex items-center gap-2"><IconFan className="text-blue-400" /> Análisis Detallado: Ventiladores</h3>
                                                    <div className="grid grid-cols-2 gap-4">
                                                        {[metrics.ventTecho, metrics.ventResto].map((t, i) => (
                                                            <div key={i} className="bg-slate-700/50 p-4 rounded-lg space-y-2 border border-slate-600">
                                                                <div className="text-blue-300 font-bold text-center border-b border-slate-600 pb-1 mb-2">{i===0 ? 'Ventiladores de Techo' : 'Resto de Ventiladores'}</div>
                                                                <div className="flex justify-between"><span className="text-slate-400">Unidades:</span><span className="font-bold">{formatNumber(t.u)}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-400">P. Mínimo:</span><span className="font-bold">{formatCurrency(t.min)}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-400">P. Promedio:</span><span className="font-bold text-emerald-400">{formatCurrency(t.sum/t.c)}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-400">P. Máximo:</span><span className="font-bold">{formatCurrency(t.max)}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-400">Conversión:</span><span className="font-bold text-amber-400">{(t.u/t.v*100).toFixed(2)}%</span></div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            <div className={`bg-white rounded-xl border p-4 shadow-sm ${isExporting ? '!p-2' : ''}`}>
                                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-2"><IconTrendingUp className="text-indigo-600" /> Evolución Mensual (Tendencia)</h3>
                                                <TrendChart data={trendData} isExporting={isExporting} />
                                            </div>
                                        </>
                                    )}
                                </div>
                            </>
                        ) : (
                            <div className="bg-white rounded-xl border-2 border-dashed border-slate-300 py-32 flex flex-col items-center text-center space-y-4">
                                <div className="bg-blue-50 text-blue-400 p-8 rounded-full mb-2"><IconUpload size={64} /></div>
                                <div className="max-w-md">
                                    <h3 className="text-2xl font-bold text-slate-800">Carga de datos para análisis</h3>
                                    <p className="text-slate-500 mt-2">Sube los reportes Excel o CSV descargados de Mercado Libre para visualizar el Benchmark de Varin.</p>
                                </div>
                                <label className="mt-4 cursor-pointer bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition-all font-bold shadow-lg">Subir archivos ahora<input type="file" multiple accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFileUpload} /></label>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
