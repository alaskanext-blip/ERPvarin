<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varin | Benchmark ML</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librerías de React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Para compilar JSX en el navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS (Excel) y HTML2PDF (PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONOS SVG INCORPORADOS ---
        const IconBarChart = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>;
        const IconUpload = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>;
        const IconDownload = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const IconFilter = ({ className = "", size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const IconAlert = ({ className = "", size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const IconPackage = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>;
        const IconFileText = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
        const IconFan = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.827 16.379a6.082 6.082 0 0 1-8.618-7.002l5.412 1.45a6.082 6.082 0 0 0 7.002-8.618l-1.45 5.412a6.082 6.082 0 0 1 8.618 7.002l-5.412-1.45a6.082 6.082 0 0 0-7.002 8.618l1.45-5.412Z"/><path d="M12 12v.01"/></svg>;
        const IconTag = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>;
        const IconChevronDown = ({ className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>;

        // --- COMPONENTE COLAPSABLE ---
        const CollapsibleCard = ({ title, icon, children }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 transition-colors border-b border-transparent data-[open=true]:border-slate-200"
                        data-open={isOpen}
                    >
                        <div className="flex items-center gap-2 font-bold text-slate-800 text-sm">
                            {icon}
                            {title}
                        </div>
                        <div className={`transition-transform duration-200 text-slate-500 ${isOpen ? 'rotate-180' : ''}`}>
                            <IconChevronDown />
                        </div>
                    </button>
                    {isOpen && (
                        <div className="p-4 bg-white border-t border-slate-200">
                            {children}
                        </div>
                    )}
                </div>
            );
        };

        // --- COMPONENTE GRAFICO CIRCULAR ---
        const DonutChart = ({ data }) => {
            if (!data || data.length === 0) return <div className="text-gray-500 text-sm">Sin datos para graficar</div>;

            const total = data.reduce((acc, item) => acc + item.value, 0);
            let cumulativePercent = 0;
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#6366f1', '#14b8a6'];

            const slices = data.map((item, index) => {
                const percent = item.value / total;
                const startAngle = cumulativePercent * 360;
                cumulativePercent += percent;
                const endAngle = cumulativePercent * 360;

                const x1 = Math.cos((startAngle - 90) * (Math.PI / 180));
                const y1 = Math.sin((startAngle - 90) * (Math.PI / 180));
                const x2 = Math.cos((endAngle - 90) * (Math.PI / 180));
                const y2 = Math.sin((endAngle - 90) * (Math.PI / 180));

                const largeArcFlag = percent > 0.5 ? 1 : 0;
                const pathData = [
                    `M ${x1} ${y1}`,
                    `A 1 1 0 ${largeArcFlag} 1 ${x2} ${y2}`,
                    `L 0 0`,
                ].join(' ');

                return (
                    <path
                        key={index}
                        d={pathData}
                        fill={colors[index % colors.length]}
                        className="transition-all duration-300 hover:opacity-80"
                    />
                );
            });

            return (
                <div className="flex items-center gap-6">
                    <div className="relative w-32 h-32">
                        <svg viewBox="-1 -1 2 2" className="w-full h-full transform -rotate-90">
                            {slices}
                            <circle cx="0" cy="0" r="0.6" fill="white" />
                        </svg>
                    </div>
                    <div className="flex flex-col gap-2">
                        {data.map((item, index) => (
                            <div key={index} className="flex items-center gap-2 text-sm text-gray-600">
                                <span className="w-3 h-3 rounded-full" style={{ backgroundColor: colors[index % colors.length] }}></span>
                                <span className="font-medium">{item.name}:</span>
                                <span>{((item.value / total) * 100).toFixed(1)}% ({item.value})</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- APLICACIÓN PRINCIPAL ---
        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [selectedMonth, setSelectedMonth] = useState('Todos');
            const [selectedCategory, setSelectedCategory] = useState('Todas');

            const formatCurrency = (val) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(val);
            const formatNumber = (val) => new Intl.NumberFormat('es-CL').format(val);

            const cleanNumber = (val) => {
                if (typeof val === 'number') return val;
                if (!val || val === '-') return 0;
                return parseFloat(val.toString().replace(/\./g, '').replace(/,/g, '.')) || 0;
            };

            const getGenericType = (name) => {
                if (!name) return "Otro";
                const firstWord = name.split(" ")[0].trim();
                return firstWord.charAt(0).toUpperCase() + firstWord.slice(1).toLowerCase();
            };

            const handleFileUpload = async (event) => {
                const files = event.target.files;
                if (!files || files.length === 0) return;

                setLoading(true);
                setError('');

                try {
                    let newData = [];
                    // Ahora incluimos "Eléctricos" que se mapeará a "Heaters"
                    const targetSheets = ["Electrodomésticos", "Climatización", "Ventiladores", "Eléctricos"];

                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        
                        let monthStr = "Desconocido";
                        const dateMatch = file.name.match(/(\d{4})-(\d{2})-\d{2}/);
                        if (dateMatch) {
                            const [_, year, month] = dateMatch;
                            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
                            monthStr = `${monthNames[parseInt(month) - 1]} ${year}`;
                        }

                        const buffer = await file.arrayBuffer();
                        const workbook = window.XLSX.read(buffer, { type: 'array' });

                        workbook.SheetNames.forEach(sheetName => {
                            const matchedSheet = targetSheets.find(t => sheetName.includes(t));
                            
                            if (matchedSheet) {
                                // Mapear nombre de hoja a categoría si es necesario
                                const matchedCategory = matchedSheet === "Eléctricos" ? "Heaters" : matchedSheet;
                                
                                const sheet = workbook.Sheets[sheetName];
                                const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1 });

                                let headerIdx = -1;
                                for (let r = 0; r < Math.min(20, rows.length); r++) {
                                    if (rows[r] && rows[r].includes("Nombre") && rows[r].includes("Precio")) {
                                        headerIdx = r;
                                        break;
                                    }
                                }

                                if (headerIdx !== -1) {
                                    const headers = rows[headerIdx];
                                    for (let r = headerIdx + 1; r < rows.length; r++) {
                                        const row = rows[r];
                                        if (!row || row.length === 0 || !row[headers.indexOf("Nombre")]) continue;

                                        let record = { Categoria: matchedCategory, Mes: monthStr, Archivo: file.name };
                                        headers.forEach((h, idx) => { record[h] = row[idx]; });

                                        record.PrecioLimpio = cleanNumber(record["Precio"]);
                                        record.UnidadesLimpias = cleanNumber(record["Unidades vendidas"]);
                                        record.VisitasLimpias = cleanNumber(record["Vistas"]);
                                        record.TipoGenerico = getGenericType(record["Nombre"]);

                                        newData.push(record);
                                    }
                                }
                            }
                        });
                    }

                    if (newData.length > 0) {
                        setData(prev => [...prev, ...newData]);
                    } else {
                        setError('No se encontraron datos válidos (Electrodomésticos, Climatización, Ventiladores o Eléctricos) en el archivo.');
                    }
                } catch (err) {
                    console.error(err);
                    setError('Error al procesar. Asegúrate de que es un Excel válido.');
                } finally {
                    setLoading(false);
                    event.target.value = '';
                }
            };

            const handleDownloadPDF = () => {
                const element = document.getElementById('report-content');
                const opt = {
                    margin: 0.3,
                    filename: `Reporte_Benchmark_ML_${selectedMonth.replace(' ', '_')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
                };
                window.html2pdf().set(opt).from(element).save();
            };

            const availableMonths = useMemo(() => {
                const months = new Set(data.map(d => d.Mes));
                return ['Todos', ...Array.from(months).sort()];
            }, [data]);

            const filteredData = useMemo(() => {
                return data.filter(d => {
                    const matchMonth = selectedMonth === 'Todos' || d.Mes === selectedMonth;
                    const matchCategory = selectedCategory === 'Todas' || d.Categoria === selectedCategory;
                    return matchMonth && matchCategory;
                });
            }, [data, selectedMonth, selectedCategory]);

            const metrics = useMemo(() => {
                if (filteredData.length === 0) return null;

                const prices = filteredData.map(d => d.PrecioLimpio).filter(p => p > 0);
                const totalUnits = filteredData.reduce((acc, d) => acc + d.UnidadesLimpias, 0);
                const totalVisits = filteredData.reduce((acc, d) => acc + d.VisitasLimpias, 0);
                
                // CÁLCULO DE VENTA TOTAL (Precio x Unidades vendidas por fila)
                const totalSales = filteredData.reduce((acc, d) => acc + (d.PrecioLimpio * d.UnidadesLimpias), 0);
                
                // TOP GENERICOS
                const genericTypes = {};
                filteredData.forEach(d => {
                    genericTypes[d.TipoGenerico] = (genericTypes[d.TipoGenerico] || 0) + d.UnidadesLimpias;
                });
                const topGenerics = Object.entries(genericTypes).sort((a,b) => b[1] - a[1]).slice(0, 5);

                // TOP PALABRAS EN TITULOS (AHORA TOP 15)
                const stopWords = new Set([
                    "de", "la", "el", "en", "y", "a", "los", "las", "un", "una", "con", "para", "por", 
                    "su", "te", "al", "lo", "como", "mas", "más", "o", "pero", "este", "esta", "se", 
                    "del", "que", "sin", "cm", "mm", "kg", "lt", "ml", "litros", "w", "watts", "v", 
                    "volts", "pack", "x", "x2", "x3", "pulgadas", "litro", "l", "mts"
                ]);
                const wordCounts = {};
                
                filteredData.forEach(d => {
                    if (d["Nombre"]) {
                        // Limpiar puntuación y dividir en palabras
                        const words = d["Nombre"].toLowerCase()
                            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()""'']/g," ")
                            .split(/\s+/);
                        
                        words.forEach(w => {
                            // Filtrar palabras cortas, stop words y números puros
                            if (w.length > 2 && !stopWords.has(w) && isNaN(w)) {
                                wordCounts[w] = (wordCounts[w] || 0) + 1;
                            }
                        });
                    }
                });
                const topWords = Object.entries(wordCounts).sort((a, b) => b[1] - a[1]).slice(0, 15);

                // ENVIOS
                const shipping = {};
                filteredData.forEach(d => {
                    const env = d["Envío"] || "Desconocido";
                    shipping[env] = (shipping[env] || 0) + 1;
                });
                const shippingChartData = Object.entries(shipping).map(([name, value]) => ({ name, value }));

                // VENTILADORES
                let ventTecho = { units: 0, visits: 0, minP: Infinity, maxP: -Infinity, sumP: 0, count: 0 };
                let ventResto = { units: 0, visits: 0, minP: Infinity, maxP: -Infinity, sumP: 0, count: 0 };

                if (selectedCategory === 'Ventiladores' || selectedCategory === 'Todas') {
                    const ventData = filteredData.filter(d => d.Categoria === 'Ventiladores');
                    ventData.forEach(d => {
                        const isTecho = d["Nombre"].toLowerCase().includes("techo");
                        const target = isTecho ? ventTecho : ventResto;
                        target.units += d.UnidadesLimpias;
                        target.visits += d.VisitasLimpias;
                        target.count += 1;
                        if (d.PrecioLimpio > 0) {
                            target.minP = Math.min(target.minP, d.PrecioLimpio);
                            target.maxP = Math.max(target.maxP, d.PrecioLimpio);
                            target.sumP += d.PrecioLimpio;
                        }
                    });
                }

                return {
                    minPrice: prices.length > 0 ? Math.min(...prices) : 0,
                    maxPrice: prices.length > 0 ? Math.max(...prices) : 0,
                    avgPrice: prices.length > 0 ? prices.reduce((a,b)=>a+b,0) / prices.length : 0,
                    totalUnits,
                    totalVisits,
                    totalSales,
                    conversionRate: totalVisits > 0 ? (totalUnits / totalVisits) * 100 : 0,
                    topGenerics,
                    topWords,
                    shippingChartData,
                    ventiladoresSplit: { ventTecho, ventResto }
                };
            }, [filteredData, selectedCategory]);

            return (
                <div className="min-h-screen bg-slate-100 text-slate-800 font-sans p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                    <IconBarChart className="text-blue-600" />
                                    Varin | Benchmark ML
                                </h1>
                                <p className="text-sm text-slate-500 mt-1">Sube tus archivos Excel para acumular y analizar la información.</p>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <label className="cursor-pointer bg-blue-50 text-blue-700 hover:bg-blue-100 px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 border border-blue-200">
                                    <IconUpload />
                                    {loading ? 'Procesando...' : 'Subir Data (Excel/CSV)'}
                                    <input type="file" multiple accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFileUpload} disabled={loading} />
                                </label>
                                
                                {data.length > 0 && (
                                    <button onClick={handleDownloadPDF} className="bg-slate-800 text-white hover:bg-slate-700 px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm">
                                        <IconDownload /> Exportar PDF
                                    </button>
                                )}
                            </div>
                        </div>

                        {error && (
                            <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-md flex items-center gap-3 text-red-700">
                                <IconAlert /> <p>{error}</p>
                            </div>
                        )}

                        {data.length > 0 ? (
                            <>
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap gap-6 items-center">
                                    <div className="flex items-center gap-2 text-slate-700 font-medium">
                                        <IconFilter className="text-slate-400" /> Filtros:
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <label className="text-sm text-slate-500">Mes:</label>
                                        <select className="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 outline-none" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)}>
                                            {availableMonths.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <label className="text-sm text-slate-500">Categoría:</label>
                                        <div className="flex bg-slate-100 rounded-lg p-1">
                                            {['Todas', 'Electrodomésticos', 'Climatización', 'Ventiladores', 'Heaters'].map(cat => (
                                                <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-3 py-1.5 text-sm font-medium rounded-md transition-all ${selectedCategory === cat ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
                                                    {cat}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="ml-auto text-sm text-slate-500 font-medium">
                                        Registros analizados: <span className="text-slate-800">{formatNumber(filteredData.length)}</span>
                                    </div>
                                </div>

                                <div id="report-content" className="space-y-6">
                                    <div className="hidden print:block mb-6">
                                        <h2 className="text-3xl font-bold text-slate-800 border-b-2 border-slate-200 pb-2">Varin | Benchmark ML</h2>
                                        <div className="flex justify-between text-slate-500 mt-2">
                                            <span>Categoría: {selectedCategory}</span>
                                            <span>Período: {selectedMonth}</span>
                                        </div>
                                    </div>

                                    {metrics && (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-center">
                                                    <p className="text-sm text-slate-500 font-medium">Unidades Vendidas</p>
                                                    <p className="text-2xl font-bold text-slate-800">{formatNumber(metrics.totalUnits)}</p>
                                                </div>
                                                
                                                <div className="bg-emerald-50 p-4 rounded-xl shadow-sm border border-emerald-100 flex flex-col justify-center">
                                                    <p className="text-sm text-emerald-600 font-medium">Venta Total</p>
                                                    <p className="text-2xl font-bold text-emerald-900">{formatCurrency(metrics.totalSales)}</p>
                                                </div>

                                                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-center">
                                                    <p className="text-sm text-slate-500 font-medium">Visitas Totales</p>
                                                    <p className="text-2xl font-bold text-slate-800">{formatNumber(metrics.totalVisits)}</p>
                                                </div>

                                                <div className="bg-indigo-50 p-4 rounded-xl shadow-sm border border-indigo-100 flex flex-col justify-center">
                                                    <p className="text-sm text-indigo-600 font-medium">Conversión (Ventas/Visitas)</p>
                                                    <p className="text-2xl font-bold text-indigo-900">{metrics.conversionRate.toFixed(2)}%</p>
                                                </div>

                                                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-center">
                                                    <p className="text-sm text-slate-500 font-medium">Precio Mínimo</p>
                                                    <p className="text-xl font-semibold text-slate-700">{formatCurrency(metrics.minPrice)}</p>
                                                </div>

                                                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-center border-b-4 border-b-blue-500">
                                                    <p className="text-sm text-slate-500 font-medium">Precio Promedio</p>
                                                    <p className="text-xl font-bold text-slate-800">{formatCurrency(metrics.avgPrice)}</p>
                                                </div>

                                                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-center">
                                                    <p className="text-sm text-slate-500 font-medium">Precio Máximo</p>
                                                    <p className="text-xl font-semibold text-slate-700">{formatCurrency(metrics.maxPrice)}</p>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
                                                <CollapsibleCard title="Envío" icon={<IconPackage className="text-emerald-500 w-5 h-5" />}>
                                                    <div className="flex justify-center items-center h-40">
                                                        <DonutChart data={metrics.shippingChartData} />
                                                    </div>
                                                </CollapsibleCard>

                                                <CollapsibleCard title="Productos Genéricos" icon={<IconFileText className="text-purple-500 w-5 h-5" />}>
                                                    <div className="space-y-3 max-h-56 overflow-y-auto pr-2">
                                                        {metrics.topGenerics.map(([type, units], i) => (
                                                            <div key={i} className="flex items-center justify-between">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="w-5 h-5 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-[10px] font-bold">{i+1}</span>
                                                                    <span className="font-medium text-slate-700 text-xs">{type}</span>
                                                                </div>
                                                                <div className="flex items-center gap-3">
                                                                    <div className="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                                        <div className="h-full bg-purple-500 rounded-full" style={{ width: `${(units / metrics.topGenerics[0][1]) * 100}%` }}></div>
                                                                    </div>
                                                                    <span className="text-xs font-semibold text-slate-800 w-12 text-right">{formatNumber(units)} u.</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </CollapsibleCard>

                                                <CollapsibleCard title="Palabras más usadas" icon={<IconTag className="text-amber-500 w-5 h-5" />}>
                                                    <div className="space-y-3 max-h-56 overflow-y-auto pr-2">
                                                        {metrics.topWords.map(([word, count], i) => (
                                                            <div key={i} className="flex items-center justify-between">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="w-5 h-5 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-[10px] font-bold">{i+1}</span>
                                                                    <span className="font-medium text-slate-700 text-xs capitalize">{word}</span>
                                                                </div>
                                                                <div className="flex items-center gap-3">
                                                                    <div className="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                                        <div className="h-full bg-amber-500 rounded-full" style={{ width: `${(count / metrics.topWords[0][1]) * 100}%` }}></div>
                                                                    </div>
                                                                    <span className="text-xs font-semibold text-slate-800 w-16 text-right">{formatNumber(count)} vec.</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </CollapsibleCard>
                                            </div>

                                            {(selectedCategory === 'Ventiladores' || selectedCategory === 'Todas') && metrics.ventiladoresSplit.ventTecho.count > 0 && (
                                                <div className="bg-slate-800 rounded-xl shadow-sm p-6 text-white">
                                                    <h3 className="text-lg font-bold flex items-center gap-2 mb-6">
                                                        <IconFan className="text-blue-400" /> Análisis Detallado: Ventiladores
                                                    </h3>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                        <div className="bg-slate-700/50 rounded-lg p-5 border border-slate-600">
                                                            <h4 className="text-blue-300 font-semibold mb-4 text-center border-b border-slate-600 pb-2">Techo</h4>
                                                            <div className="space-y-3">
                                                                <div className="flex justify-between"><span className="text-slate-300 text-sm">Unidades Vendidas:</span><span className="font-bold">{formatNumber(metrics.ventiladoresSplit.ventTecho.units)}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-300 text-sm">Visitas:</span><span className="font-bold">{formatNumber(metrics.ventiladoresSplit.ventTecho.visits)}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-300 text-sm">Precio Promedio:</span><span className="font-bold text-emerald-400">{formatCurrency(metrics.ventiladoresSplit.ventTecho.sumP / Math.max(1, metrics.ventiladoresSplit.ventTecho.count))}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-300 text-sm">Conversión:</span><span className="font-bold text-amber-400">{metrics.ventiladoresSplit.ventTecho.visits > 0 ? ((metrics.ventiladoresSplit.ventTecho.units / metrics.ventiladoresSplit.ventTecho.visits) * 100).toFixed(2) : 0}%</span></div>
                                                            </div>
                                                        </div>
                                                        <div className="bg-slate-700/50 rounded-lg p-5 border border-slate-600">
                                                            <h4 className="text-blue-300 font-semibold mb-4 text-center border-b border-slate-600 pb-2">Resto</h4>
                                                            <div className="space-y-3">
                                                                <div className="flex justify-between"><span className="text-slate-300 text-sm">Unidades Vendidas:</span><span className="font-bold">{formatNumber(metrics.ventiladoresSplit.ventResto.units)}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-300 text-sm">Visitas:</span><span className="font-bold">{formatNumber(metrics.ventiladoresSplit.ventResto.visits)}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-300 text-sm">Precio Promedio:</span><span className="font-bold text-emerald-400">{formatCurrency(metrics.ventiladoresSplit.ventResto.sumP / Math.max(1, metrics.ventiladoresSplit.ventResto.count))}</span></div>
                                                                <div className="flex justify-between"><span className="text-slate-300 text-sm">Conversión:</span><span className="font-bold text-amber-400">{metrics.ventiladoresSplit.ventResto.visits > 0 ? ((metrics.ventiladoresSplit.ventResto.units / metrics.ventiladoresSplit.ventResto.visits) * 100).toFixed(2) : 0}%</span></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            </>
                        ) : (
                            <div className="bg-white rounded-xl border border-slate-200 border-dashed p-12 flex flex-col items-center justify-center text-center">
                                <div className="bg-blue-50 text-blue-500 w-16 h-16 rounded-full flex items-center justify-center mb-4">
                                    <IconUpload size={32} />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">No hay datos cargados</h3>
                                <p className="text-slate-500 max-w-md">Sube tus archivos de mercado (Excel o CSV) que contengan las hojas de Electrodomésticos, Climatización o Ventiladores.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
